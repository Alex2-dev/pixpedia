# Environnement de développement Pixpedia.
# Prérequis : `pnpm install` sur l'hôte (les conteneurs utilisent le dépôt monté tel quel).

x-node: &node
  image: node:22-bookworm-slim
  user: '${UID:-1000}:${GID:-1000}'
  working_dir: /repo
  volumes:
    - ./:/repo
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  networks: [pixpedia-net]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5436}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [pixpedia-net]

  migrate:
    <<: *node
    command: ['node_modules/.bin/tsx', 'packages/db/src/migrate.ts']
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *node
    command: ['node_modules/.bin/tsx', 'watch', 'apps/api/src/server.ts']
    ports:
      - '127.0.0.1:${API_PORT:-3014}:${API_PORT:-3014}'
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *node
    # Planificateur : synchronisation incrémentale IGDB chaque jour à WORKER_SYNC_HOUR.
    command: ['node_modules/.bin/tsx', 'apps/worker/src/cli.ts', 'schedule']
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    <<: *node
    working_dir: /repo/apps/web
    environment:
      API_PROXY_TARGET: http://api:${API_PORT:-3014}
    command: ['node_modules/.bin/vite', '--host', '0.0.0.0', '--port', '${WEB_PORT:-5186}']
    ports:
      - '127.0.0.1:${WEB_PORT:-5186}:${WEB_PORT:-5186}'

volumes:
  pgdata:

networks:
  pixpedia-net:
