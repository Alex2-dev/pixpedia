# Nginx interne du conteneur pixpedia-web : sert le front et relaie l'API.
# Le Nginx du serveur (nginx-proxy) lui transmet tout /pixpedia/ sans le retirer.
server {
    listen 80;
    server_tokens off;

    location = /pixpedia {
        return 301 /pixpedia/;
    }

    # API : /pixpedia/api/x → api:3014/x. CF-Connecting-IP et X-Real-IP passent tels quels.
    location /pixpedia/api/ {
        proxy_pass http://api:3014/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    root /usr/share/nginx/html;

    # Fichiers versionnés par Vite : cache long.
    location /pixpedia/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker et page d'entrée : toujours revalidés, sinon les mises à jour n'arrivent pas.
    location ~ ^/pixpedia/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
    }

    # Application monopage : toute route inconnue renvoie l'index.
    location /pixpedia/ {
        try_files $uri $uri/ /pixpedia/index.html;
    }
}
